<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src mediastream:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Creator Compiler recording preview</title><link rel="stylesheet" href="recording-hud.css"></head><body>
 <!-- Borumi's recorder: the camera edge to edge with its source chips and a close button over it, then one control bar, then the script. -->
 <p class="sr-only"><strong id="status" role="status">Starting…</strong> <span id="title"></span></p>
 <main class="island-content">
  <section id="camera" hidden><video id="camera-video" autoplay muted playsinline aria-label="Live camera preview" hidden></video><img id="camera-image" alt="Live camera preview" hidden><canvas id="waveform" aria-label="Microphone level" role="img" hidden></canvas><span id="camera-wait">Waiting for camera preview…</span>
   <div id="sources"><span id="camera-chip" class="chip"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="camera-label">Camera</span></span><span id="mic-chip" class="chip wide"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="microphone-hint"></span><span id="microphone-meter" role="meter" aria-label="Microphone input level" aria-valuemin="0" aria-valuemax="100"><span id="microphone-bar"></span></span></span></div>
  </section>
  <div class="recording-controls drag">
   <span id="clock">00:00</span>
   <div class="bar-center"><button id="stop" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg><span class="label">Stop</span></button>
   <button id="pause" class="round" aria-label="Pause recording" title="Pause"><svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg><svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><span class="sr-only" id="pause-text">Pause</span></button>
   <button id="retry" class="round" aria-label="Record this take again" title="Record again"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button></div>
   <div class="bar-end"><button id="more" class="round" aria-label="More" aria-haspopup="menu" aria-expanded="false" title="More"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg></button></div>
  </div>
  <section class="prompt" hidden><div id="script" role="document" aria-label="Recording script" tabindex="0"></div>
   <button id="auto-pill" type="button" aria-pressed="false" title="Scroll script automatically while recording"><svg class="icon on-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="m8 12.5 2.5 2.5L16 9.5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="icon off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8" stroke-linecap="round"/></svg>Auto-scroll</button>
  </section>
 </main>
 <div id="countdown" role="status" hidden><div class="orb"><span id="countdown-number">3</span></div><div class="countdown-actions"><button id="start-now" type="button">Start now</button><button id="cancel-countdown" type="button" class="quiet">Cancel</button></div></div>
 <button id="close" class="round overlay" aria-label="Stop and close" title="Close"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
 <div id="menu" role="menu" aria-label="Recorder" hidden>
  <label class="menu-check" role="menuitemcheckbox"><input id="mirror-preview" type="checkbox"><span>Mirror preview</span></label>
  <label class="menu-check" role="menuitemcheckbox"><input id="show-sources" type="checkbox" checked><span>Show sources</span></label>
  <div class="sep"></div>
  <button id="camera-toggle" role="menuitem" aria-expanded="false" title="Show or hide the preview; your camera keeps recording" aria-label="Show camera preview"><span>Camera preview</span></button>
  <button id="script-toggle" role="menuitem" aria-expanded="false" aria-label="Expand teleprompter" title="Expand teleprompter"><span>Script</span></button>
  <button id="reading-settings" role="menuitem" aria-expanded="false" aria-label="Reading settings" title="Reading settings"><span>Scrolling and text size</span></button>
  <div id="reading-options" hidden><label class="auto-scroll-option"><span>Auto-scroll</span><input id="auto-scroll" type="checkbox" aria-label="Auto-scroll script"></label><label><span>Text size <output id="font-value" for="font-size">16</output></span><input id="font-size" type="range" min="12" max="42" step="1" value="16" aria-label="Script text size"></label><label><span>Scroll speed <output id="speed-value" for="speed">40</output></span><input id="speed" type="range" min="20" max="100" step="5" value="40" aria-label="Script scroll speed"><span class="speed-scale"><span>Slower</span><span>Faster</span></span></label></div>
  <div class="sep"></div>
  <button id="editor" role="menuitem" aria-label="Return to editor" title="Return to editor"><span>Show Creator Compiler</span></button>
 </div>
 <p id="notice" role="status"></p>
 <script src="recording-hud.js"></script></body></html>
