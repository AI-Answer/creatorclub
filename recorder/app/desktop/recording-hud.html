<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src mediastream:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Creator Compiler recording preview</title><link rel="stylesheet" href="recording-hud.css"></head><body>
 <!-- Borumi's recorder (its recorder bundle, index-DAWue-_s.js): the preview with its source chips, the error and warning banners, the
      toolbar, the script, the close button, the recording-start flash and the countdown. Sizes come from the window, as Borumi's do. -->
 <p class="sr-only"><strong id="status" role="status">Starting…</strong> <span id="title"></span></p>
 <main class="recorder" id="recorder">
  <section id="camera" class="preview">
   <video id="camera-video" autoplay muted playsinline aria-label="Live camera preview" hidden></video><img id="camera-image" alt="Live camera preview" hidden><canvas id="waveform" aria-label="Microphone level" role="img" hidden></canvas>
   <div id="chips-top" class="chips-top"></div>
   <div id="chips-bottom" class="chips-bottom"><div id="sources" class="chip-row"><button type="button" id="camera-chip" class="chip" data-source="camera"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="camera-label" class="name">Camera</span></button><button type="button" id="mic-chip" class="chip" data-source="microphone"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="microphone-hint" class="name"></span><span id="microphone-meter" role="meter" aria-label="Microphone input level" aria-valuemin="0" aria-valuemax="100"><span id="microphone-bar"></span></span></button></div></div>
  </section>
  <div id="error-banner" class="banner error" role="alert" hidden><p class="banner-title" id="error-title"></p><p id="error-message"></p></div>
  <div id="warning-banner" class="banner warning" role="status" hidden><p class="banner-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span id="warning-title"></span></p><p id="warning-message" class="medium"></p></div>
  <div class="recording-controls drag" id="toolbar">
   <span id="clock">00:00</span>
   <div class="bar-center"><button id="record" class="primary" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg><span>Record</span></button><button id="stop" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg><span class="label">Stop</span></button><span class="bar-secondary" id="bar-secondary"><button id="pause" class="round" aria-label="Pause recording" title="Pause"><svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg><svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><span class="sr-only" id="pause-text">Pause</span></button><button id="retry" class="round" aria-label="Record this take again" title="Record again"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button></span></div>
   <div class="bar-end"><button id="more" class="round" aria-label="More" aria-haspopup="menu" title="More"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg></button></div>
  </div>
  <section class="prompt" id="prompt" hidden><div id="script" role="document" aria-label="Recording script" tabindex="0"></div>
   <div class="pill-row" id="pill-row"><div class="pill" id="pill"><button id="auto-pill" type="button" aria-pressed="false" title="Scroll script automatically while recording"><svg class="icon on-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12.5 3 3 6-6.5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="icon off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8" stroke-linecap="round"/></svg><span>Auto-scroll</span></button><button id="rewind" type="button" aria-label="Rewind to start" title="Rewind script to the top" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" fill="currentColor"/></svg></button></div></div>
   <div class="speech-prompt" id="speech-prompt" hidden><div class="speech-card"><p id="speech-text">Creator Compiler needs Speech Recognition permission to follow your voice.</p><button type="button" id="speech-allow">Allow</button></div></div>
  </section>
 </main>
 <div id="flash" aria-hidden="true"></div>
 <div id="init" role="status" hidden><div class="init-ring" aria-hidden="true"></div><div id="init-text">Getting things ready...</div></div>
 <div id="countdown" role="status" hidden><div class="countdown-inner"><div class="orb"><span id="countdown-number">3</span></div><div class="countdown-actions"><button id="start-now" type="button">Start now</button><button id="cancel-countdown" type="button" class="quiet">Cancel</button></div></div></div>
 <button id="close" class="overlay" aria-label="Close recorder" title="Close"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
 <script src="script-follower.js"></script>
 <script src="recording-hud.js"></script></body></html>
