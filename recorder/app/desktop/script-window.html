<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Script</title><link rel="stylesheet" href="script-window.css"></head><body>
 <!-- Borumi's teleprompter window (index-Bek2B5yO.js, ye): the close button, the script or an empty message, and the toolbar. -->
 <div id="root" class="teleprompter">
  <button type="button" id="close" class="close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div id="empty" class="empty" hidden><h2 id="empty-title"></h2><p id="empty-text"></p></div>
  <div id="view" class="view" hidden>
   <div id="baseline-guide" class="guide guide-h" aria-hidden="true"></div><div id="baseline-handle" class="handle handle-h" data-tip="Adjust baseline"></div>
   <div id="left-guide" class="guide guide-v" aria-hidden="true"></div><div id="left-handle" class="handle handle-v" data-guide="Left" data-tip="Adjust text width"></div>
   <div id="right-guide" class="guide guide-v" aria-hidden="true"></div><div id="right-handle" class="handle handle-v" data-guide="Right" data-tip="Adjust text width"></div>
   <div id="scroller" class="scroller teleprompter-scrollbar"><div id="column" class="column"><div id="lead"></div><div id="tokens" role="document" aria-label="Recording script"></div><div id="trail"></div></div></div>
  </div>
  <div id="toolbar-wrap" class="toolbar-wrap" hidden>
   <div id="toolbar" class="toolbar"><div class="toolbar-row"><div class="controls">
    <div class="group" data-control="playback"><button type="button" class="tool" id="play" data-tip="Start scrolling" aria-label="Start scrolling"><svg class="icon play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><svg class="icon pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg><svg class="icon warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></button><button type="button" class="tool" id="rewind" data-tip="Rewind to start" aria-label="Rewind to start"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" fill="currentColor"/></svg></button></div>
    <div class="group" data-control="scrollingMode"><button type="button" class="tool" id="mode-manual" data-mode="Manual" data-tip="Manual scrolling" aria-label="Manual scrolling"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg></button><button type="button" class="tool" id="mode-voice" data-mode="VoiceOptimistic" data-tip="Voice Following scrolling" aria-label="Voice Following scrolling"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></button><button type="button" class="tool" id="mode-constant" data-mode="ConstSpeed" data-tip="Constant speed scrolling" aria-label="Constant speed scrolling"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button></div>
    <div class="group" data-control="fontSize"><button type="button" class="tool" id="smaller" data-tip="Decrease text size" aria-label="Decrease text size"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19 8.5 5 14 19M5 14h7M16 12h6"/></svg></button><button type="button" class="tool" id="larger" data-tip="Increase text size" aria-label="Increase text size"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19 8.5 5 14 19M5 14h7M19 9v6M16 12h6"/></svg></button></div>
    <div class="group" data-control="textAlignment"><button type="button" class="tool" id="align-start" data-tip="Left align" aria-label="Left align"><svg class="icon start" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg><svg class="icon end" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M10 12h10M7 18h13"/></svg></button><button type="button" class="tool" id="align-center" data-align="Center" data-tip="Center align" aria-label="Center align"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M5.5 18h13"/></svg></button></div>
    <div class="group" data-control="theme"><button type="button" class="tool" id="theme"><svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
   </div>
   <div class="group more-group"><button type="button" class="tool" id="more" data-tip="More options" aria-label="More options" aria-haspopup="menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg></button></div>
   </div></div>
  </div>
  <div id="speech" class="speech" hidden><div class="speech-card"><p id="speech-text"></p><button type="button" id="speech-allow">Allow</button></div></div>
  <div id="speed" class="speed" hidden><span>Speed</span><input id="speed-input" type="range" min="8" max="30" step="1" aria-label="Scrolling speed"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
 </div>
 <script src="script-follower.js"></script><script src="script-window.js"></script></body></html>
